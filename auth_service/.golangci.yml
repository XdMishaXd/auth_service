version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none

  enable:
    # Базовые
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    # Error handling
    - errorlint
    - wrapcheck

    # Context
    - contextcheck
    - noctx
    - containedctx

    # Style / idiomatic Go
    - revive
    - gocritic

    # Security
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(

    revive:
      rules:
        - name: exported
          severity: warning
        - name: error-return
          severity: error
        - name: error-naming
          severity: error
        - name: context-as-argument
          severity: error
        - name: context-keys-type
          severity: error
        - name: unused-parameter
          severity: warning

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam

    gosec:
      excludes:
        - G104

  exclusions:
    rules:
      # Тестовые файлы
      - path: _test\.go
        linters:
          - wrapcheck
          - gosec

      # Моки в тестах
      - path: _test\.go
        linters:
          - unused-parameter

      # QF1008
      - path: internal/storage/postgres/
        linters:
          - staticcheck
        text: "QF1008"

      - path: cmd/main.go
        linters:
          - staticcheck
        text: "QF1008"

      - path: internal/auth/2fa/
        linters:
          - staticcheck
        text: "QF1008"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
