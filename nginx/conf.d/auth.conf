limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=auth_conn:10m;

upstream auth_backend {
  server auth_service:8082;
  keepalive 32;
}

server {
  listen 80;
  server_name localhost;

  location = /healthz {
    return 200 "ok";
    add_header Content-Type text/plain;
    access_log off;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name localhost;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  client_max_body_size 1m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  access_log /var/log/nginx/auth_access.log;
  error_log  /var/log/nginx/auth_error.log warn;

  location / {
    limit_req zone=auth_limit burst=20 nodelay;
    limit_conn auth_conn 10;

    proxy_pass http://auth_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 1;
  }

  location = /healthz {
    proxy_pass http://auth_backend;
    access_log off;
  }

  location = /metrics {
    deny all;   # метрики только для prometheus по внутренней сети, не через публичный vhost
  }
}
