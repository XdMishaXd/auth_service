limit_req_zone $binary_remote_addr zone=grafana_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=grafana_api:10m rate=50r/s;

upstream grafana_backend {
  server grafana:3000;
	keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name grafana.localhost;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name grafana.localhost;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  client_max_body_size 1m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  access_log /var/log/nginx/grafana_access.log;
  error_log  /var/log/nginx/grafana_error.log warn;

  auth_basic "Grafana access";
  auth_basic_user_file /etc/nginx/.htpasswd;

	# Логин и общие страницы — строгий лимит
	location = /login {
    limit_req zone=grafana_limit burst=10 nodelay;

    proxy_pass http://grafana_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  # API-запросы дашбордов — мягкий лимит, высокий burst, таймауты подлиннее
  location /api/ {
    limit_req zone=grafana_api burst=100 nodelay;

    proxy_pass http://grafana_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # Grafana Live/websocket для realtime-панелей
  location /api/live/ {
    proxy_pass http://grafana_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

	# Всё остальное — статика, UI-страницы
  location / {
    limit_req zone=grafana_limit burst=20 nodelay;

    proxy_pass http://grafana_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }
}
