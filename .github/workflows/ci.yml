name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: auth_service/go.sum

      - name: Vet
        working-directory: ./auth_service
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: ./auth_service
          version: v2.12.2

      - name: Test
        working-directory: ./auth_service
        run: go test -race -cover ./...

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create dummy env files for config validation
        run: |
          echo "POSTGRES_USER=ci" >> .env
          echo "POSTGRES_PASSWORD=ci" >> .env
          echo "POSTGRES_DB=ci" >> .env
          echo "PLACEHOLDER=ci" > ./auth_service/.env
          echo "PLACEHOLDER=ci" > ./email_sender/.env
          echo "PLACEHOLDER=ci" > ./monitoring/.env

      - name: Validate docker compose config
        run: docker compose config --quiet

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build auth_service image
        run: docker build -f ./auth_service/docker/Dockerfile -t auth_service:ci ./auth_service
